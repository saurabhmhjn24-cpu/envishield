name: Deploy Cloudflare Worker

# Deploys the weather / air-quality proxy whenever its code changes on main.
# Secrets for the Worker itself (Ambient keys, AccuWeather key, data.gov.in key) stay in Cloudflare
# and are not touched by this deploy. Only the two repository secrets below are needed here.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
