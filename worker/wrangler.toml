name = "ambient-weather-proxy"
main = "worker.js"
compatibility_date = "2026-07-01"

# Non-secret config. Set this to your actual GitHub Pages URL,
# e.g. "https://saurabh-sho.github.io" (no trailing slash, no path).
[vars]
ALLOWED_ORIGIN = "https://saurabhmhjn24-cpu.github.io"

# The real secrets (MAC address, API key, application key, AccuWeather key) are NOT set here.
# Set them with the wrangler CLI so they never touch a file that gets committed:
#
#   wrangler secret put AMBIENT_MAC
#   wrangler secret put AMBIENT_API_KEY
#   wrangler secret put AMBIENT_APP_KEY
#   wrangler secret put ACCUWEATHER_API_KEY
#   wrangler secret put DATA_GOV_IN_API_KEY   (free key from https://data.gov.in, used by the /aqi route)
#
# Each command will prompt you to paste the value — it's stored encrypted
# in Cloudflare, not in this repo.
